# BitSentry fork only (lives on bitsentry/build, never on main or a contribution branch).
#
# A release tag v<upstream>-bitsentry.N on bitsentry/build:
#   1. build  (GitHub-hosted)  web + telegram-bridge images, pushed to private GHCR
#                              packages tagged <release> and sha-<commit>
#   2. deploy (self-hosted on bitsentry-mcp) pull those tags with this job's own
#                              read-only package token, back up, compose up, health
#                              check, restore on failure: deploy/bitsentry/deploy.sh
# Nothing is built on bitsentry-mcp.
#
# Triggers: a tag pushed (by a person or by the upstream sync), a GitHub Release
# published for such a tag, or a manual re-run with a tag.
name: BitSentry deploy

on:
  push:
    tags: ['v*-bitsentry.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (v<upstream>-bitsentry.N)
        required: true
        type: string

concurrency:
  group: bitsentry-deploy
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io/agustinustheo

jobs:
  resolve:
    if: github.repository == 'agustinustheo/automata-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-${RELEASE_TAG:-$REF_NAME}}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-bitsentry\.[0-9]+$ ]]; then
            echo "::error::not a bitsentry release tag: $tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on bitsentry/build
        id: sha
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch -q origin bitsentry/build
          git merge-base --is-ancestor "refs/tags/$TAG" origin/bitsentry/build \
            || { echo "::error::$TAG is not on bitsentry/build"; exit 1; }
          echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - dockerfile: apps/web/Dockerfile
            image: automata-mcp-web
          - dockerfile: apps/telegram-bridge/Dockerfile
            image: automata-mcp-telegram-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build --platform linux/amd64 -f "$DOCKERFILE" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.version=$TAG" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            -t "$IMAGE:$TAG" -t "$IMAGE:sha-${SHA:0:12}" \
            --push .
          docker logout ghcr.io

  deploy:
    needs: [resolve, build]
    runs-on: [self-hosted, bitsentry-mcp, automata-deploy]
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      # This job's own token, read-only on packages, valid for this job only:
      # nothing long-lived is stored on the server.
      - name: Log in to GHCR (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Deploy
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          REGISTRY: ${{ env.REGISTRY }}
        run: deploy/bitsentry/deploy.sh "$TAG"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

      - name: Publish the GitHub Release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          api="https://api.github.com/repos/$REPO/releases"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          if curl -sf "${auth[@]}" "$api/tags/$TAG" >/dev/null; then echo "release exists"; exit 0; fi
          jq -n --arg t "$TAG" '{tag_name:$t, name:$t, body:"Deployed to bitsentry-mcp by the BitSentry deploy workflow.", prerelease:false}' \
            | curl -sf "${auth[@]}" -X POST "$api" -d @- >/dev/null

# BitSentry fork only (lives on bitsentry/build, the fork's default branch: GitHub
# only offers workflow_dispatch for workflows on the default branch).
# Upstream sync, run on demand (scheduled externally, from Grok Bot):
#   gh workflow run bitsentry-sync.yml -R agustinustheo/automata-mcp --ref bitsentry/build
# deploy/bitsentry/sync.sh. A new tag it pushes triggers bitsentry-deploy.yml.
name: BitSentry upstream sync

on:
  workflow_dispatch:

concurrency:
  group: bitsentry-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'agustinustheo/automata-mcp'
    runs-on: [self-hosted, bitsentry-mcp, automata-deploy]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bitsentry/build
          persist-credentials: false
      - name: Sync upstream, check, tag
        run: deploy/bitsentry/sync.sh
